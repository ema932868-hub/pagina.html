
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi página web | Andrea López</title>
  <style>
:root {
  --fondo: #ffffff;
  --texto: #1d2433;
  --azul: #2563eb;
  --lateral: #dbe7fb;
  --tarjeta: #ffffff;
  --borde: #9aa8c4;
  --pie: #1e2a44;
}
body.oscuro {
  --fondo: #11151f;
  --texto: #e8ecf5;
  --azul: #1d4ed8;
  --lateral: #1c2740;
  --tarjeta: #181e2c;
  --borde: #4a5878;
  --pie: #0a0d14;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--fondo);
  color: var(--texto);
  line-height: 1.5;
}
header { background: var(--azul); color: #fff; padding: 16px 20px 0; }
.barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
#btn-tema {
  background: #fff; color: var(--azul); border: 0;
  padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer;
}
nav { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px 0; }
nav a { color: #fff; text-decoration: none; font-size: .9rem; }
nav a:hover { text-decoration: underline; }

.contenedor { display: flex; gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }
main { flex: 1; min-width: 0; }
section {
  background: var(--tarjeta);
  border: 1px dashed var(--borde);
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
section h2 { margin-top: 0; font-size: 1.1rem; }
h3 { font-size: .95rem; margin-bottom: 4px; }
mark { background: #ffe58a; padding: 0 3px; }
blockquote {
  margin: 10px 0; padding: 8px 14px;
  border-left: 4px solid var(--azul);
  background: var(--lateral); font-style: italic;
}
a { color: var(--azul); }
body.oscuro a { color: #8ab4ff; }

table { width: 100%; border-collapse: collapse; }
th { background: var(--azul); color: #fff; text-align: left; }
th, td { border: 1px solid var(--borde); padding: 6px 10px; }

.medios {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
}
figure { margin: 0; min-width: 0; }
figure img, figure video {
  display: block;
  width: 100%;
  height: 300px;
  object-fit: contain;
  background: #0b0f18;
  border-radius: 6px;
}
figcaption { font-size: .8rem; margin-top: 4px; }

form { display: grid; gap: 6px; max-width: 360px; }
label { font-size: .9rem; margin-top: 6px; }
input, select { padding: 8px; border: 1px solid var(--borde); border-radius: 4px; font-size: 1rem; }
form button {
  margin-top: 10px; background: var(--azul); color: #fff; border: 0;
  padding: 10px; border-radius: 6px; font-weight: 700; cursor: pointer;
}
#mensaje { font-weight: 700; margin: 6px 0 0; }

aside {
  width: 240px; background: var(--lateral); border-radius: 6px;
  padding: 14px; align-self: flex-start;
}
aside h2 { margin-top: 0; font-size: 1.05rem; }
details { border: 1px dashed var(--borde); padding: 8px 10px; border-radius: 4px; }
summary { cursor: pointer; font-weight: 700; }

footer { background: var(--pie); color: #fff; text-align: center; padding: 18px; font-size: .85rem; }

@media (max-width: 700px) {
  .contenedor { flex-direction: column; }
  aside { width: 100%; }
}


.marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; background: #fff; flex-shrink: 0; }
.datos { margin: 2px 0 0; font-size: .8rem; line-height: 1.3; }
@media (max-width: 700px) { .barra { flex-wrap: wrap; } }
</style>
</head>
